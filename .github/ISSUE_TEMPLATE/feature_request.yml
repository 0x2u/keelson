name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please check the [limitations](https://github.com/0x2u/keelson/blob/main/docs/limitations.md) and the open issues first. Open the issue before writing code.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
