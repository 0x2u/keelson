version: 2
# Minor and patch updates arrive grouped, one pull request per ecosystem. Major versions of the toolchain are chosen on purpose
# and by hand (see docs/development.md), so they are not proposed: the runtime is Node.js 24 (an even-numbered LTS line: the
# dashboard needs node:sqlite), so @types/node stays on 24 and the Docker base image on 24 until the next LTS is adopted;
# TypeScript majors are taken deliberately, with the lint rules that follow them.
updates:
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      go-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      dashboard-minor-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /mcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      mcp-minor-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /dashboard
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - { dependency-name: node, update-types: ["version-update:semver-major"] }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
