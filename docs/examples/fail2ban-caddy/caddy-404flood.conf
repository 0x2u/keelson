[Definition]
# Many 404s in a short time from one address is an automated probe (a human never makes 15 in 60 s). maxretry and findtime are
# in the jail. Read from Caddy's JSON access log: request.client_ip, then the status after the request object.
failregex = ^\{.*"client_ip":"<ADDR>".*"status":404,

ignoreregex =

datepattern = "ts":{EPOCH}
