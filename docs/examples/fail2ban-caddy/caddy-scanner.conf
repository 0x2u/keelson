[Definition]
# Same paths as nginx-scanner (probes for WordPress/PHP/.env/.git/admin tools that never exist on this Next.js site; one hit is
# enough), read from Caddy's JSON access log: the client address Caddy worked out (the visitor behind Cloudflare) is
# request.client_ip, and the method, host and URI follow it.
failregex = ^\{.*"client_ip":"<ADDR>","proto":"[^"]*","method":"(?:GET|POST|HEAD)","host":"[^"]*","uri":"/(?:wp-login\.php|wp-admin|wp-content|wp-includes|xmlrpc\.php|\.env|\.git/|\.svn/|phpmyadmin|phpMyAdmin|pma|admin\.php|config\.php|configuration\.php|\.aws/credentials|vendor/phpunit|\.well-known/[^"]*\.php|wordpress|wp2|old|backup|[^"]*\.sql|[^"]*\.bak|aws\.yml|\.ssh/|id_rsa|eval-stdin\.php|shell\.php|cgi-bin/)

ignoreregex =

datepattern = "ts":{EPOCH}
